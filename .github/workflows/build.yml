name: Build Metro AutoConnect v2.0 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f MetroAutoConnect-v2.0-AndroidStudio.zip || {
            echo "The MetroAutoConnect-v2.0-AndroidStudio.zip file is missing from the root of the repository." >&2
            exit 1
          }
          unzip -oq MetroAutoConnect-v2.0-AndroidStudio.zip
          test -f MetroAutoConnect/app/build.gradle
          grep -q "versionName '2.0.0'" MetroAutoConnect/app/build.gradle

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then manager="$(command -v sdkmanager)"; fi
          "$manager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: MetroAutoConnect
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroAutoConnect-v2-APK
          path: MetroAutoConnect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
