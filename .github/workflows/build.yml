name: Build Metro AutoConnect APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          archive="$(find . -maxdepth 1 -type f -iname 'MetroAutoConnect*.zip' | sort | head -n 1)"
          if [ -z "$archive" ]; then
            echo 'ERROR: MetroAutoConnect ZIP not found in repository root.' >&2
            exit 1
          fi
          echo "Using archive: $archive"
          unzip -q "$archive"
          test -f MetroAutoConnect/settings.gradle

      - name: Repair captive portal WebView and unsupported APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path('MetroAutoConnect')
          root = project / 'app/src/main'
          source = root / 'java/com/metrolink/autoconnect'
          replacements = {
              'MainActivity.java': (
                  'connectivity.startCaptivePortalApp(network);',
                  'openIntent(new Intent(Intent.ACTION_VIEW, Uri.parse("https://gowifi.ru")));',
              ),
              'PortalActivity.java': (
                  'connectivity.startCaptivePortalApp(wifi);',
                  'startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://gowifi.ru")));',
              ),
          }
          for filename, (old, new) in replacements.items():
              file = source / filename
              content = file.read_text(encoding='utf-8')
              if old in content:
                  if content.count(old) != 1:
                      raise SystemExit(f'Unexpected number of API calls in {filename}')
                  file.write_text(content.replace(old, new), encoding='utf-8')
                  print(f'Fixed unsupported API in {filename}')
              elif new not in content:
                  raise SystemExit(f'Unexpected source code in {filename}')

          manifest = root / 'AndroidManifest.xml'
          content = manifest.read_text(encoding='utf-8')
          if 'android:networkSecurityConfig=' not in content:
              marker = 'android:allowBackup="false"'
              if content.count(marker) != 1:
                  raise SystemExit('Cannot find Android application settings')
              content = content.replace(marker, marker + '\n        android:networkSecurityConfig="@xml/network_security_config"')
              manifest.write_text(content, encoding='utf-8')

          config = root / 'res/xml/network_security_config.xml'
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">wi-fi.ru</domain>
              </domain-config>
          </network-security-config>
          ''', encoding='utf-8')
          print('Enabled HTTP only for the wi-fi.ru captive-portal domain')

          gradle = project / 'app/build.gradle'
          gradle_text = gradle.read_text(encoding='utf-8')
          gradle_text = gradle_text.replace('versionCode 2', 'versionCode 3')
          gradle_text = gradle_text.replace("versionName '1.1.0'", "versionName '1.2.0'")
          gradle.write_text(gradle_text, encoding='utf-8')
          print('Version set to 1.2.0')
          PY

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        working-directory: MetroAutoConnect
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroAutoConnect-APK
          path: MetroAutoConnect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
                  'startActivity(new Intent(Settings.ACTION_WIFI_SETTINGS));'
              ),
          }
          for filename, (old, new) in fixes.items():
              path = root / filename
              source = path.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'Expected API call not found exactly once in {path}')
              path.write_text(source.replace(old, new), encoding='utf-8')
              print(f'Fixed: {path}')
          PY
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK and install platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: MetroAutoConnect
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroAutoConnect-APK
          path: MetroAutoConnect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
