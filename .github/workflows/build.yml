name: Build Metro AutoConnect APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          archive="$(find . -maxdepth 1 -type f -iname 'MetroAutoConnect*.zip' | sort | head -n 1)"
          test -n "$archive" || { echo 'No MetroAutoConnect ZIP found'; exit 1; }
          unzip -q "$archive"
          test -f MetroAutoConnect/settings.gradle

      - name: Fix Java APIs and MT_FREE HTTP portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('MetroAutoConnect/app/src/main')
          java = root / 'java/com/metrolink/autoconnect'
          changes = {
              'MainActivity.java': ('connectivity.startCaptivePortalApp(network);', 'openIntent(new Intent(Intent.ACTION_VIEW, Uri.parse("https://gowifi.ru")));'),
              'PortalActivity.java': ('connectivity.startCaptivePortalApp(wifi);', 'startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://gowifi.ru")));'),
          }
          for filename, (before, after) in changes.items():
              path = java / filename
              content = path.read_text(encoding='utf-8')
              if content.count(before) == 1:
                  path.write_text(content.replace(before, after), encoding='utf-8')
              elif after not in content:
                  raise SystemExit('Unexpected source: ' + filename)
          manifest = root / 'AndroidManifest.xml'
          content = manifest.read_text(encoding='utf-8')
          if 'android:networkSecurityConfig=' not in content:
              marker = 'android:allowBackup="false"'
              assert content.count(marker) == 1
              manifest.write_text(content.replace(marker, marker + '\n        android:networkSecurityConfig="@xml/network_security_config"'), encoding='utf-8')
          xml = root / 'res/xml/network_security_config.xml'
          xml.parent.mkdir(parents=True, exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="false" />\n  <domain-config cleartextTrafficPermitted="true">\n    <domain includeSubdomains="true">wi-fi.ru</domain>\n  </domain-config>\n</network-security-config>\n', encoding='utf-8')
          print('Android portal patches applied')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then manager="$(command -v sdkmanager)"; fi
          "$manager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: MetroAutoConnect
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroAutoConnect-APK
          path: MetroAutoConnect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
